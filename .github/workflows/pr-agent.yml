name: PR Agent

on:
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event.issue.pull_request && github.event.comment.user.login == 'lyssieth' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@main
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable auto-triggers, only comment commands
          PR_AGENT_AUTO_REVIEW: "false"
          PR_AGENT_AUTO_DESCRIBE: "false"
          PR_AGENT_AUTO_IMPROVE: "false"
